name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Single-machine MPI runs: keep MPICH's UCX transport off the VM's
      # network devices, which some runners expose but cannot use.
      UCX_TLS: self,sm,tcp
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test,examples]" mpich
      - name: Tests
        run: python -m pytest
      - name: Examples
        working-directory: examples
        run: |
          python quickstart.py > /dev/null
          python checkpointing.py
          python matched_vs_mismatched.py
          python matrix_completion.py | tail -10
          mpiexec -n 2 python p_laplacian.py --rings 25
          mpiexec -n 2 python p_laplacian.py --rings 25 --ball precond
          mpiexec -n 2 python p_laplacian_eigen.py --rings 25 --start random

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test,examples]" mpich
      - name: mypy --strict
        run: python -m mypy
